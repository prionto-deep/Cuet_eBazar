# The frontend is a Vite + React SPA living in /frontend.
# Setting `base` makes Netlify build only that folder (and ignore the
# Python backend / virtualenvs at the repo root).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"   # relative to `base` -> frontend/dist

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_BASE_URL in the Netlify UI (Site settings > Environment variables)
  # to the URL of your deployed backend.

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
